services:
  - type: web
    name: vera-bot
    runtime: python
    branch: claude/vera-agentic-system-7y9s2m
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /v1/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VERA_LLM
        value: "off"          # set to "auto" and add ANTHROPIC_API_KEY to enable the LLM drafting pass
