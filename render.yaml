services:
  - type: web
    name: vera-bot
    runtime: python
    branch: claude/vera-agentic-system-7y9s2m
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn bot:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /v1/healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: VERA_LLM
        value: "off"          # set to "auto" and add ANTHROPIC_API_KEY to enable the LLM drafting pass
      # Demo chat history (SQLite). The free plan's disk resets on every restart/deploy, so saved chats last until
      # then. For permanent history: switch to a paid plan, add a disk mounted at /var/data, and set
      # DEMO_DB=/var/data/demo_chats.db
      - key: DEMO_DB
        value: data/demo_chats.db
